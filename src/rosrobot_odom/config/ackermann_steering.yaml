# ==============================================================================
# ackermann_steering_controller 的完整配置（适用于 ROS 2 Jazzy）
# 修改时只需替换关节名称与底盘机械参数，其余建议保留
# ==============================================================================

controller_manager:
  ros__parameters:
    update_rate: 50  # 控制器管理器刷新率（Hz）

    # ----- 需要加载的控制器列表 -----
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster  # 关节状态发布器

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController  # 阿克曼转向控制器

# ----- 阿克曼转向控制器的私有参数 -----
ackermann_steering_controller:
  ros__parameters:

    # ===== 底盘机械参数（务必按实车修改）=====
    wheelbase: 0.36          # 轴距：前轮转向轴 → 后轮驱动轴（单位：米）
    wheel_track: 0.39        # 轮距：左右车轮的间距（单位：米）
    wheel_radius: 0.0625       # 车轮半径（单位：米）

    # ----- 关节名称（必须与 URDF 文件中的 joint name 完全一致）-----
    rear_wheels_names:
      ['lh_joint', 'rh_joint']         # 后轮驱动关节（数组）
    front_steering_joints_names:
      ['lq_joint', 'rq_joint'] # 前轮转向关节（数组）

    # ----- 控制指令相关 -----
    cmd_vel_topic: /cmd_vel     # 接收速度指令的话题名
    cmd_vel_timeout: 0.5        # 若超过0.5秒未收到新指令，自动停机（单位：秒）
    use_stamped_vel: false      # true: 订阅 TwistStamped 消息； false: 订阅 Twist

    # ----- 速度与转向限制 -----
    linear_velocity_max: 0.3    # 最大线速度（m/s）
    angular_velocity_max: 0.45   # 最大角速度（rad/s）
    steering_angle_max: 0.52    # 前轮最大转向角（rad），0.52 ≈ 30°

    # ----- 里程计设定（全部嵌套在 odometry 命名空间内）-----
    odometry:
      frame_id: odom                        # 里程计坐标系的 frame_id
      base_frame_id: base_link              # 机器人底座的 frame_id
      publish_rate: 50.0                    # 里程计发布频率（Hz）
      open_loop: true                      # false：使用编码器闭环计算；true：开环估算
      enable_odom_tf: true                  # 是否发布 odom -> base_link 的 tf 变换
      velocity_rolling_window_size: 10      # 速度平滑窗口大小（保留最近10次数据进行平滑）