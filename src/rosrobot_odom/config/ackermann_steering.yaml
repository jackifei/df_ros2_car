# ==============================================================================
# ackermann_steering_controller 的完整配置（适用于 ROS 2 Jazzy）
# 修改时只需替换关节名称与底盘机械参数，其余建议保留

#官方链接，请一定参考官方链接
# https://control.ros.org/jazzy/doc/ros2_controllers/steering_controllers_library/doc/userdoc.html
# ==============================================================================

controller_manager:
  ros__parameters:
    update_rate: 50  # 控制器管理器刷新率（Hz）
    #    enable_odom_tf: true
    # ----- 需要加载的控制器列表 -----
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster  # 关节状态发布器

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController  # 阿克曼转向控制器

# ----- 阿克曼转向控制器的私有参数 -----
ackermann_steering_controller:
  ros__parameters:

#    open_loop: true
    # ----- 里程计设定（全部嵌套在 odometry 命名空间内）-----
    odom_frame_id: "odom"                        # 里程计坐标系的 frame_id
    base_frame_id: "base_link"              # 机器人底座的 frame_id
    enable_odom_tf: false                  # 是否发布 odom -> base_link 的 tf 变换

    # ===== 底盘机械参数（务必按实车修改）=====
    wheelbase: 0.36          # 轴距：前轮转向轴 → 后轮驱动轴（单位：米）
    traction_track_width: 0.39        # 轮距：左右车轮的间距（单位：米）
    steering_track_width: 0.39
    traction_wheels_radius: 0.0625       # 车轮半径（单位：米）
    # ----- 关节名称（必须与 URDF 中的 joint name 完全一致）-----
    #    牵引轮关节的名称。对于具有两个牵引关节的运动学构型，预期顺序为：右关节、左关节
    traction_joints_names: ['lh_joint','rh_joint']           # ← 原 rear_wheels_names（已弃用）
    traction_joints_state_names: ['lh_joint','rh_joint']
    # 前轮

    #   转向关节的命名。对于具有两个转向关节的运动学构型，
    #   预期顺序为：右关节、左关节。转向轴的方向应按如下方式定义：当指令给出正值的转向位置时，机器人应沿车辆z轴的正方向转弯（参见REP-103）。
    steering_joints_names: ['lq_joint','rq_joint']          # ← 原 front_steering_joints_names（名称错误）
    steering_joints_state_names: ['lq_joint','rq_joint']
    #   steering_track_width: 0.39
#    steering_wheels_radius: 0.0625       # 车轮半径（单位：米）



    reduce_wheel_speed_until_steering_reached: true
#    tf_frame_prefix: false
#    twist_covariance_diagonal:  [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
#    pose_covariance_diagonal:  [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]


    # ----- 控制指令相关 -----
#    cmd_vel_topic: /cmd_vel     # 接收速度指令的话题名
    cmd_vel_timeout: 0.5        # 若超过0.5秒未收到新指令，自动停机（单位：秒）

    use_stamped_vel: false      # true: 订阅 TwistStamped 消息； false: 订阅 Twist

    # ----- 速度与转向限制 -----
    linear_velocity_max: 0.3    # 最大线速度（m/s）
    angular_velocity_max: 0.2   # 最大角速度（rad/s）
    steering_angle_max: 0.52    # 前轮最大转向角（rad），0.52 ≈ 30°



    open_loop: true                       # false：使用编码器闭环计算；true：开环估算
    position_feedback: false
    publish_rate: 50.0                    # 里程计发布频率（Hz）
    velocity_rolling_window_size: 10      # 速度平滑窗口大小（保留最近10次数据进行平滑）

