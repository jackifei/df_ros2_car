/df_front_steering:
  ros__parameters:
    # ---- 串口参数 ----
    port: '/dev/ttyUSB0'
    baudrate: 115200
    timeout: 0.5
    slave_id: 1

    # ---------------- 车辆 / 轮子参数 ----------------
    wheelbase: 0.7          # 前后轴距
    track_width: 0.74        # 轮距，左右前轮中心距离，单位 m
    # ===== 车辆几何 =====
    wheel_diameter_m: 0.255   # 后轮直径（米）
    max_linear_velocity: 0.5  # 最高线速度（米/秒），低速车限速，超出会被限幅

    max_steer_angle_deg: 30.0         # 软件最大前轮转角，单位 deg，必须小于机械极限（留 3~5° 余量）
    max_steer_angle: 0.5236     # 最大转向角的弧度值


    # ===== 低速保护 =====
    min_speed: 0.15                   # 低于此线速度进入低速保护，单位 m/s
    low_speed_hysteresis_ratio: 1.5   # 退出低速保护的倍率，v > min_speed*1.5 才退出
    steer_eps: 0.02                   # 转向意图死区，|w| < 此值视为“无转向意图”回正，单位 rad/s

    # ===== 转角平滑 =====
    max_delta_step_deg: 20.0          # 每个控制周期前轮转角最大变化量，单位 deg/周期

    # ===== 步进电机 / 脉冲映射 =====
#    zero_pulse: -1600                     # 前轮直行（delta=0）时的绝对脉冲零位
    steer_sign: 1.0                   # +1 或 -1，标定“正 delta 是否对应脉冲增加方向”
    min_pulse: 0                  # 机械软限位下限（绝对脉冲）
    max_pulse: 3000                    # 机械软限位上限（绝对脉冲）

    # 映射表：[前轮角度(deg), 相对零位的脉冲]
    steer_table_motordeg: [400.0,   800.0, 1200.0, 1600.0, 2000.0, 2400.0, 2800.0] # 电机角度
    steer_table_wheeldeg: [-30.0, -20.0, -10.0, 0.0,      10.0, 20.0,     30.0]  # 车轮角度

    # ---- 位置 / 归中补偿参数 ----
    center_pos: -1600            # 车轮回正对应的电机绝对位置（脉冲数），零点=左转向极限
    pulses_per_degree: 8.8889   # 每度转向角对应脉冲数（默认 16 细分：3200/360）
    steering_angle_limit_deg: 30.0
    steering_sign: 1.0          # 转向方向反了改成 -1.0
    pos_speed_rpm: 100          # 定位速度
    pos_accel: 200              # 定位加速度
    home_mode: 2                # 2 = 无限位碰撞回零

    # ---- 航向修正标定参数 ----
    calibration_button: 6       # /joy 按钮索引（0=A,1=B,2=X,3=Y,4=L1,5=R1,6=select,7=start...）
    calibration_settle_time: 2.0
    calibration_file: '~/.df_motor_ctr/front_steering_center.yaml'

    # ---- IMU 订阅与航向 PID 参数 ----
    imu_topic: '/imu/data_raw'
    heading_control_enabled: true
    straight_steering_threshold: 0.03
    heading_settle_time: 1.2

    # ---- IMU 故障检测与恢复参数 ----
    imu_timeout: 0.5
    yaw_jump_max_deg: 15.0
    imu_invalid_frames_before_fault: 10
    imu_recover_time: 1.0
    max_yaw_error_deg: 10.0

    # ---- PID 参数 ----
    heading_kp: 0.8
    heading_ki: 0.001
    heading_kd: 0.0
    heading_correction_sign: -1.0
    heading_correction_limit_deg: 8.0
    heading_integral_limit_deg: 5.0

    # ---- 航向角滤波参数 ----
    yaw_median_window: 9
    yaw_lowpass_alpha: 0.2
