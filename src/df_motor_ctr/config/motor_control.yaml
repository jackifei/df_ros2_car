# 后轮驱动节点配置（适配 无刷电机驱动器 MSSD-60EHB_2D）
# 详细协议见《MSSD-60EHB_2D RS485 通讯协议及寄存器说明书 V2.0》

/motor_control:
  ros__parameters:
    # ---------------- 串口参数（必须与驱动器的 485 参数一致）----------------
    port: '/dev/ttyUSB3'      # RS485 串口设备
    baudrate: 9600            # 波特率：驱动器出厂默认 9600（可选 19200/38400/57600/115200）
    parity: 'N'               # 校验：N=无校验 E=偶校验 O=奇校验（协议：无+1停止位）
    stopbits: 1               # 停止位
    bytesize: 8               # 数据位（固定 8）
    timeout: 0.2              # 单次 Modbus 应答超时（秒）
    slave_id: 1               # 驱动器从站地址：出厂默认 1（双电机一体驱动器，左右电机共用同一地址）

    # ---------------- 车辆 / 轮子参数 ----------------
    wheel_track: 0.75         # 后轮轮距（米）
    wheel_diameter_m: 0.255   # 后轮直径（米）
    max_linear_velocity: 0.5  # 最高线速度（米/秒），低速车限速，超出会被限幅

    # ---------------- 速度指令单位 ----------------
    # 'rad_s'：/hardware/rear_wheel_cmd 的 data=[右轮, 左轮] 为轮子角速度(rad/s)，默认
    # 'm_s'  ：data=[右轮, 左轮] 为轮子线速度(m/s)
    input_unit: 'rad_s'

    # ---------------- 编码器换算 ----------------
    # 电机极对数（定子南北磁极对数 = 磁极数的一半）。
    # 换向次数 -> 机械角度：angle_deg = counts * 60 / pole_pairs
    pole_pairs: 4

    # ---------------- 电机旋转方向校正 ----------------
    # 若某侧电机实际转向与指令相反（如右轮在前进指令下反转），把对应项改为 -1.0。
    left_dir_sign: 1.0
    right_dir_sign: 1.0

    # ---------------- 通信循环 / 反馈发布频率 ----------------
    loop_rate: 20.0           # 反馈读取与关节反馈发布频率（Hz）
