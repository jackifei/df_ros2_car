# =============================================================================
#  ROS2 Jazzy Navigation2 (Nav2) 完整参数配置文件 — 带中文注释
#  适用场景: 差速驱动机器人 (Differential Drive Robot)
#  控制方式: MPPI (Model Predictive Path Integral) 控制器
#  说明: 本文件基于官方参数模板，对每一项参数添加了详细的中文注释
# =============================================================================

# =============================================================================
# 1. AMCL — 自适应蒙特卡洛定位 (Adaptive Monte Carlo Localization)
#    功能: 使用粒子滤波算法估计机器人在已知地图中的位姿
#    ROS2 Jazzy中的包: nav2_amcl
# =============================================================================
amcl:
  ros__parameters:
    # --- 运动模型噪声参数 (Odometry Motion Model Noise) ---
    # alpha1: 旋转分量的旋转噪声 — 机器人旋转时，旋转估计的误差系数
    alpha1: 0.2
    # alpha2: 平移分量的旋转噪声 — 机器人平移时，旋转估计的误差系数
    alpha2: 0.2
    # alpha3: 平移分量的平移噪声 — 机器人平移时，平移估计的误差系数
    alpha3: 0.2
    # alpha4: 旋转分量的平移噪声 — 机器人旋转时，平移估计的误差系数
    alpha4: 0.2
    # alpha5: 额外的旋转噪声 — 全局旋转噪声系数（ROS2 Jazzy新增参数，旧版ROS2中可能不存在）
    alpha5: 0.2

    # --- 坐标系配置 ---
    # base_frame_id: 机器人基座坐标系，通常为 base_footprint（底盘在地面的投影）
    base_frame_id: "base_link"
    # global_frame_id: 全局固定坐标系，通常为 map（地图坐标系）
    global_frame_id: "map"
    # odom_frame_id: 里程计坐标系，通常为 odom
    odom_frame_id: "odom"

    # --- 激光扫描模型参数 (Laser Likelihood Field Model) ---
    # laser_model_type: 激光测距模型类型
    #   - "likelihood_field": 似然场模型（默认推荐，计算效率高，更平滑）
    #   - "beam": 波束模型（计算量大但更精确）
    #   - "likelihood_field_prob": 概率似然场模型
    laser_model_type: "likelihood_field"
    # laser_max_range: 激光雷达最大有效量程 (m)，超出此值的扫描点将被忽略
    laser_max_range: 8.0
    # laser_min_range: 激光雷达最小有效量程 (m)，-1.0表示不设下限
    laser_min_range: -1.0
    # laser_likelihood_max_dist: 似然场模型中查找表的最大距离 (m)，限制搜索范围以加速计算
    laser_likelihood_max_dist: 2.0
    # max_beams: 每次更新使用的最大激光束数量，随机均匀采样以保证计算效率
    max_beams: 60
    # z_hit: 命中测量的混合权重 — 表示激光束正确命中障碍物的概率权重
    z_hit: 0.5
    # z_max: 最大距离测量的混合权重 — 表示激光束因超出量程返回最大值的概率权重
    z_max: 0.05
    # z_rand: 随机测量的混合权重 — 表示激光束返回随机值的概率权重（如被遮挡）
    z_rand: 0.5
    # z_short: 短距离测量的混合权重 — 表示激光束因意外物体提前返回的概率权重
    z_short: 0.05
    # sigma_hit: 命中模型的高斯标准差 (m)，控制命中概率分布的宽度
    sigma_hit: 0.2
    # lambda_short: 短距离测量模型的指数衰减率参数
    lambda_short: 0.1

    # --- 波束跳跃参数 (Beam Skip) ---
    # do_beamskip: 是否启用波束跳跃 — 减少更新时处理的激光束数量以提升性能
    do_beamskip: false
    # beam_skip_distance: 两个激光束之间的距离阈值 (m)，小于此值的相邻波束才考虑跳过
    beam_skip_distance: 0.5
    # beam_skip_threshold: 波束跳跃的百分比阈值 — 仅当要跳过的波束比例高于此值时才执行
    beam_skip_threshold: 0.3
    # beam_skip_error_threshold: 波束跳跃引入的误差容忍度 — 较高的值允许更激进的跳过
    beam_skip_error_threshold: 0.9

    # --- 粒子滤波器参数 (Particle Filter) ---
    # min_particles: 粒子数量的下限，保证最小定位精度
    min_particles: 500
    # max_particles: 粒子数量的上限，限制最大计算量
    max_particles: 2000
    # pf_err: 粒子滤波器KLD采样误差阈值，较小的值需要更多粒子但精度更高
    pf_err: 0.05
    # pf_z: 粒子滤波器KLD采样的标准正态分布分位数（1-p值），0.99对应99%置信度
    pf_z: 0.99

    # --- 恢复行为参数 (Recovery) ---
    # recovery_alpha_fast: 快速恢复的指数衰减率 — 当定位突然变差时注入随机粒子的速率
    #   设为0.0禁用快速恢复
    recovery_alpha_fast: 0.0
    # recovery_alpha_slow: 慢速恢复的指数衰减率 — 当定位长期偏差时注入随机粒子的速率
    #   设为0.0禁用慢速恢复，适合对称环境（如长廊）避免粒子发散
    recovery_alpha_slow: 0.0

    # --- 重采样与更新参数 ---
    # resample_interval: 重采样间隔 — 每隔多少次滤波器更新后进行重采样
    resample_interval: 1
    # update_min_a: 最小角度变化阈值 (rad) — 机器人旋转超过此值才触发滤波器更新
    update_min_a: 0.2
    # update_min_d: 最小平移变化阈值 (m) — 机器人移动超过此值才触发滤波器更新
    update_min_d: 0.25
    # transform_tolerance: 坐标变换容忍时间 (s)，允许使用稍旧的tf变换
    transform_tolerance: 1.0

    # --- 机器人运动模型 ---
    # robot_model_type: 机器人运动模型类型
    #   - "nav2_amcl::DifferentialMotionModel": 差速驱动模型（两轮差速）
    #   - "nav2_amcl::OmniMotionModel": 全向运动模型（麦克纳姆轮等）
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # --- 其他配置 ---
    # save_pose_rate: 保存位姿到参数服务器的频率 (Hz)，用于持久化最近一次估计位姿
    save_pose_rate: 0.5
    # tf_broadcast: 是否广播 map->odom 的TF变换，建议设为true以发布坐标变换
    tf_broadcast: true
    # scan_topic: 激光扫描数据的话题名称
    scan_topic: scan

# =============================================================================
# 2. BT Navigator — 行为树导航器
#    功能: 管理导航行为树 (Behavior Tree) 的执行，协调各个导航动作
#    ROS2 Jazzy中的包: nav2_bt_navigator
# =============================================================================
bt_navigator:
  ros__parameters:
    # global_frame: 全局坐标系名称
    global_frame: map
    # robot_base_frame: 机器人基座坐标系
    robot_base_frame: base_link
    # odom_topic: 里程计话题名称
    odom_topic: /odom
    # bt_loop_duration: 行为树的循环执行周期 (ms)，每10ms tick一次行为树
    bt_loop_duration: 10
    # default_server_timeout: 默认的行为树节点服务器响应超时 (ms)
    default_server_timeout: 20
    # wait_for_service_timeout: 等待导航相关服务启动的超时时间 (ms)
    wait_for_service_timeout: 1000
    # action_server_result_timeout: Action服务器结果等待超时 (s)
    action_server_result_timeout: 900.0
    # navigators: 启用的导航器类型列表
    #   - "navigate_to_pose": 导航到单个目标点
    #   - "navigate_through_poses": 依次导航经过多个目标点（航点序列）
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      # 导航到单个目标点的行为树插件
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      # 导航通过多个航点的行为树插件
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 默认行为树XML文件说明:
    #   默认使用 nav2_bt_navigator 包中的:
    #   - navigate_to_pose_w_replanning_and_recovery.xml (单点导航含重规划和恢复)
    #   - navigate_through_poses_w_replanning_and_recovery.xml (多航点导航含重规划和恢复)
    #   可通过 launch 文件的 RewrittenYaml 重映射或在此处直接指定来覆盖

    # plugin_lib_names: 添加自定义行为树插件库名称 (字符串列表)
    #   内置插件会自动加载，无需在此配置
    # plugin_lib_names: []

    # error_code_names: 行为树中使用的错误码变量名称
    error_code_names:
      - compute_path_error_code    # 计算路径错误码
      - follow_path_error_code     # 跟随路径错误码

# =============================================================================
# 3. Controller Server — 控制器服务器
#    功能: 执行局部路径跟踪，计算并发布速度指令 (cmd_vel)
#    使用算法: MPPI (Model Predictive Path Integral Control) 模型预测路径积分控制
#    ROS2 Jazzy中的包: nav2_controller, nav2_mppi_controller
# =============================================================================
controller_server:
  ros__parameters:
    # controller_frequency: 控制器运行频率 (Hz)，每秒20次控制循环
    controller_frequency: 20.0
    # costmap_update_timeout: 等待代价地图更新的超时时间 (s)
    costmap_update_timeout: 0.30
    # min_x_velocity_threshold: 最小X方向线速度阈值 (m/s)，低于此值认为X方向速度为零
    min_x_velocity_threshold: 0.001
    # min_y_velocity_threshold: 最小Y方向线速度阈值 (m/s)，低于此值认为Y方向速度为零
    #   对于差速机器人，Y方向速度为0，此值设大一点防止侧向漂移
    min_y_velocity_threshold: 0.5
    # min_theta_velocity_threshold: 最小角速度阈值 (rad/s)，低于此值认为角速度为零
    min_theta_velocity_threshold: 0.001
    # failure_tolerance: 控制失败容忍时间 (s) — 控制器可在路径跟踪失败后容忍的时间
    failure_tolerance: 0.3

    # --- 插件配置 ---
    # progress_checker_plugins: 进度检查器插件列表 — 检测机器人是否在向目标前进
    progress_checker_plugins: ["progress_checker"]
    # goal_checker_plugins: 目标检查器插件列表 — 判断机器人是否已到达目标
    #   可选: "precise_goal_checker" (更严格的精度要求，被注释掉了)
    goal_checker_plugins: ["general_goal_checker"]
    # controller_plugins: 控制器插件列表 — 实际执行路径跟踪的算法
    controller_plugins: ["FollowPath"]
    # use_realtime_priority: 是否使用实时优先级（需要系统支持实时调度）
    use_realtime_priority: false

    # --- 进度检查器 (Progress Checker) ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # required_movement_radius: 需要的最小移动半径 (m) — 在此时间内至少需要移动此距离
      required_movement_radius: 0.5
      # movement_time_allowance: 移动时间允许 (s) — 在此时间内必须满足最小移动要求
      movement_time_allowance: 10.0

    # --- 精度目标检查器 (Precise Goal Checker) — 当前被注释掉 ---
    # precise_goal_checker:
    #   plugin: "nav2_controller::SimpleGoalChecker"
    #   xy_goal_tolerance: 0.25      # XY平面目标容差 (m)
    #   yaw_goal_tolerance: 0.25     # 偏航角目标容差 (rad)
    #   stateful: True               # 有状态模式（一旦满足条件即保持，避免振荡）

    # --- 通用目标检查器 (General Goal Checker) ---
    general_goal_checker:
      # stateful: 有状态模式 — 一旦判断到达目标，即使机器人微小移动也不撤销判断
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # xy_goal_tolerance: XY平面目标容差 (m) — 距目标点此距离以内即认为到达
      xy_goal_tolerance: 0.25
      # yaw_goal_tolerance: 偏航角目标容差 (rad) — 角度偏差小于此值即认为到达
      yaw_goal_tolerance: 0.25

    # =========================================================================
    # MPPI 控制器 (FollowPath) — 模型预测路径积分控制
    # 原理: 在控制时域内采样大量随机轨迹，加权平均得到最优控制序列
    # 优点: 能处理非线性动力学、障碍物约束、多目标优化
    # =========================================================================
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # --- 时间与采样参数 ---
      # time_steps: 预测时域步数 — 向前预测的离散时间步数
      #   56步 × model_dt = 56 × 0.05s = 2.8s 预测时长
      time_steps: 56
      # model_dt: 每步时间间隔 (s) — 时间步长，越小精度越高但计算量越大
      model_dt: 0.05
      # batch_size: 每轮优化的采样轨迹数量 — 越多越可能找到最优解，但计算量增加
      #   2000条随机轨迹 × 56步 = 需要较大CPU资源
      batch_size: 2000

      # --- 加速度约束 (用于轨迹采样) ---
      # ax_max / ax_min: X方向最大/最小加速度 (m/s²)，正值向前的加速度
      ax_max: 3.0
      ax_min: -3.0
      # ay_max / ay_min: Y方向最大/最小加速度 (m/s²)，差速机器人Y方向通常为0
      ay_max: 3.0
      ay_min: -3.0
      # az_max: Z轴旋转方向最大角加速度 (rad/s²)
      az_max: 3.5

      # --- 速度采样噪声标准差 (控制探索程度) ---
      # vx_std: X方向线速度噪声标准差 (m/s) — 每次采样的速度扰动幅度
      vx_std: 0.2
      # vy_std: Y方向线速度噪声标准差 (m/s)
      vy_std: 0.2
      # wz_std: 角速度噪声标准差 (rad/s) — 适当增大可增强避障能力
      wz_std: 0.4

      # --- 速度约束 (机器人物理能力限制) ---
      # vx_max: X方向最大线速度 (m/s) — 向前最大速度 0.5m/s
      vx_max: 0.5
      # vx_min: X方向最小线速度 (m/s) — 负值表示允许后退，最大后退速度 0.35m/s
      vx_min: -0.35
      # vy_max: Y方向最大线速度 (m/s) — 差速机器人侧向速度为0
      vy_max: 0.5
      # wz_max: 最大角速度 (rad/s) — 约1.9 rad/s ≈ 108°/s
      wz_max: 1.9

      # --- 优化与控制参数 ---
      # iteration_count: MPPI优化的迭代次数 — 每轮优化执行几次迭代
      iteration_count: 1
      # prune_distance: 轨迹剪枝距离 (m) — 舍弃与控制序列相差超过此距离的轨迹
      prune_distance: 1.7
      # transform_tolerance: TF坐标变换容忍时间 (s)
      transform_tolerance: 0.1
      # temperature: MPPI温度参数 — 控制代价加权后的轨迹选择分布
      #   较小的值（如0.3）更倾向于低代价轨迹（趋向最优解，但可能陷入局部最优）
      #   较大的值允许更多探索（更保守但不够精确）
      temperature: 0.3
      # gamma: 控制序列平滑度权重 — 控制输入变化率的惩罚系数
      #   较大的值产生更平滑的控制序列但响应更慢
      gamma: 0.015
      # motion_model: 运动模型类型 — "DiffDrive" 差速驱动模型
      motion_model: "DiffDrive"
      # visualize: 是否发布可视化的采样轨迹用于RViz显示
      visualize: true
      # regenerate_noises: 是否每轮重新生成随机噪声序列
      #   true: 每轮完全随机采样（探索性更好）
      #   false: 使用固定噪声种子（确定性更高，便于调试）
      regenerate_noises: true

      # --- MPPI 可视化参数 ---
      TrajectoryVisualizer:
        # trajectory_step: 每隔多少条轨迹显示一条（减少可视化计算量）
        trajectory_step: 5
        # time_step: 每隔多少个时间步显示一个点
        time_step: 3

      # --- Ackermann 转向约束 (差速机器人通常不需要，此处为兼容性保留) ---
      AckermannConstraints:
        # min_turning_r: 最小转弯半径 (m) — Ackermann转向模型的最小转弯半径
        min_turning_r: 0.2

      # --- MPPI 评价器/评判器列表 (Critics) ---
      # 每个Critic评估轨迹的不同方面，加权求和为总代价
      critics: [
        "ConstraintCritic",    # 约束评判：惩罚违反速度/加速度约束的轨迹
        "CostCritic",          # 代价评判：惩罚靠近障碍物的轨迹（碰撞代价）
        "GoalCritic",          # 目标评判：奖励接近最终目标的轨迹
        "GoalAngleCritic",     # 目标角度评判：奖励朝向目标角度的轨迹
        "PathAlignCritic",     # 路径对齐评判：奖励与全局路径对齐（位置）的轨迹
        "PathFollowCritic",    # 路径跟随评判：奖励跟随全局路径的轨迹
        "PathAngleCritic",     # 路径角度评判：奖励与路径方向一致的轨迹
        "PreferForwardCritic"  # 前向偏好评判：奖励向前运动的轨迹（避免倒车）
      ]

      # --- ConstraintCritic: 约束评判器 ---
      # 功能: 惩罚不满足运动学/动力学约束的轨迹
      ConstraintCritic:
        enabled: true           # 是否启用此评判器
        cost_power: 1           # 代价幂次 — 代价 = (惩罚值)^cost_power
        cost_weight: 4.0        # 代价权重 — 在总代价中的加权系数

      # --- GoalCritic: 目标评判器 ---
      # 功能: 评估轨迹终点到导航目标点的距离，鼓励靠近目标
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        # threshold_to_consider: 评判阈值 (m) — 距离目标小于此值时才激活此评判
        #   防止远距离时此评判主导优化，使机器人在远离目标时也能灵活避障
        threshold_to_consider: 1.4

      # --- GoalAngleCritic: 目标角度评判器 ---
      # 功能: 评估轨迹终点朝向与目标角度的偏差
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      # --- PreferForwardCritic: 前向偏好评判器 ---
      # 功能: 鼓励机器人向前行驶而非倒车
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      # --- CostCritic: 代价评判器（碰撞检测核心） ---
      # 功能: 评估轨迹是否与障碍物碰撞，使用全局代价地图的代价值
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81         # 代价权重 — 调整此值可改变避障的激进程度
        near_collision_cost: 253   # 接近碰撞的代价阈值（代价地图值Lethal=254，253为接近致死）
        critical_cost: 300.0       # 临界代价阈值 — 超过此值认为轨迹不可行
        consider_footprint: false  # 是否在碰撞计算中考虑机器人精确轮廓（false用圆近似，更快）
        collision_cost: 1000000.0  # 碰撞代价 — 发生碰撞时赋予的极高代价，确保被淘汰
        near_goal_distance: 1.0    # 接近目标距离 (m) — 距目标此距离时降低碰撞敏感度
        trajectory_point_step: 2   # 每隔几个轨迹点检查一次碰撞（减少计算量）

      # --- PathAlignCritic: 路径对齐评判器 ---
      # 功能: 评估轨迹与全局规划路径在空间位置上的对齐程度
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0          # 权重较高，强调机器人严格跟随路径走
        # max_path_occupancy_ratio: 最大路径占用比 — 路径上允许的障碍物比例上限
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4   # 每隔几个轨迹点检查一次对齐
        threshold_to_consider: 0.5 # 到路径的距离小于此值才激活评判
        offset_from_furthest: 20   # 从最远点向前偏移检查的数量
        use_path_orientations: false # 是否使用路径方向信息来评估对齐

      # --- PathFollowCritic: 路径跟随评判器 ---
      # 功能: 评估轨迹与全局规划路径的跟随偏差（比PathAlign更宽松）
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5    # 从轨迹最远点向前偏移跟踪路径的步数
        threshold_to_consider: 1.4 # 距路径距离小于此值才激活

      # --- PathAngleCritic: 路径角度评判器 ---
      # 功能: 评估轨迹方向与路径方向的偏差（角度对齐）
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0 # 到路径最远点的最大允许角度偏差 (rad)
        mode: 0                    # 模式0: 使用路径点间的方向向量进行计算

      # --- TwirlingCritic: 旋转评判器 (被注释掉) ---
      # 功能: 惩罚机器人在原地旋转的行为（twirling），防止机器人原地打转
      # 如果你的机器人在导航中频繁原地旋转，可以考虑启用此评判器
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

# =============================================================================
# 4. Local Costmap — 局部代价地图
#    功能: 维护机器人周围的局部障碍物信息，供控制器进行局部路径规划和避障
#    特点: 使用滚动窗口 (rolling window)，以机器人为中心
#    ROS2 Jazzy中的包: nav2_costmap_2d
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      # update_frequency: 代价地图更新频率 (Hz)
      update_frequency: 5.0
      # publish_frequency: 代价地图发布频率 (Hz) — 可视化/调试用
      publish_frequency: 2.0
      # global_frame: 全局坐标系 — 局部代价地图使用 odom 坐标系（跟随机器人）
      global_frame: odom
      # robot_base_frame: 机器人基座坐标系
      robot_base_frame: base_link
      # rolling_window: 是否使用滚动窗口 — true表示代价地图跟随机器人移动
      rolling_window: true
      # width: 代价地图宽度 (m) — 3m宽，以机器人为中心各1.5m
      width: 3
      # height: 代价地图高度 (m) — 3m高，以机器人为中心各1.5m
      height: 3
      # resolution: 栅格分辨率 (m/cell) — 每个栅格0.05m = 5cm
      resolution: 0.05
      # robot_radius: 机器人半径 (m) — 用于碰撞检测，0.22m = 22cm（适用于TurtleBot4等小型机器人）
      robot_radius: 0.22
      # plugins: 代价地图插件列表
      plugins: ["voxel_layer", "inflation_layer"]

      # --- 膨胀层 (Inflation Layer) ---
      # 功能: 在障碍物周围生成膨胀区域，生成远离障碍物的代价梯度
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor: 代价缩放因子 — 控制代价随距离下降的速率
        #   值越大，代价下降越快（膨胀区域越小），机器人越靠近障碍物
        #   值越小，代价下降越慢（膨胀区域越大），机器人越远离障碍物
        cost_scaling_factor: 3.0
        # inflation_radius: 膨胀半径 (m) — 障碍物的影响范围，0.7m的保持距离
        inflation_radius: 0.70

      # --- 体素层 (Voxel Layer) ---
      # 功能: 使用3D体素网格处理激光扫描数据，转换为2D障碍物标记
      #   体素层适用于处理有高度的障碍物（如桌子，仅在地面以上才标记为障碍）
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # publish_voxel_map: 是否发布3D体素地图用于可视化
        publish_voxel_map: True
        # origin_z: 体素网格的Z轴原点 (m) — 以机器人base_link为基准的高度原点
        origin_z: 0.0
        # z_resolution: Z轴体素分辨率 (m) — 每个体素层的高度
        z_resolution: 0.05
        # z_voxels: Z轴体素层数 — 16层 × 0.05m = 0.8m 总高度监测范围
        z_voxels: 16
        # max_obstacle_height: 最大障碍物高度 (m) — 超过此高度的物体不被视为障碍
        max_obstacle_height: 2.0
        # mark_threshold: 标记阈值 — 体素被观测到的次数阈值，超过此值才标记为障碍
        mark_threshold: 0
        # observation_sources: 观测源列表 — 用于感知障碍物的传感器
        observation_sources: scan
        scan:
          topic: /scan                 # 激光扫描话题
          max_obstacle_height: 2.0     # 传感器能感知的最大障碍物高度
          clearing: True               # 是否清除障碍物（光线穿过区域清除旧标记）
          marking: True                # 是否标记障碍物（光线击中区域标记新障碍）
          data_type: "LaserScan"       # 数据类型: LaserScan 或 PointCloud2
          raytrace_max_range: 3.0      # 光线追踪最大范围 (m) — 用于清除障碍物
          raytrace_min_range: 0.0      # 光线追踪最小范围 (m)
          obstacle_max_range: 2.5      # 障碍物检测最大范围 (m) — 超过此距离的扫描点忽略
          obstacle_min_range: 0.0      # 障碍物检测最小范围 (m)

      # --- 静态层 (Static Layer) — 在滚动窗口中通常不使用 ---
      # 局部代价地图是滚动的，一般不需要静态地图层
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # map_subscribe_transient_local: 是否订阅瞬态本地地图（ROS2 Jazzy特性）
        map_subscribe_transient_local: True
      # always_send_full_costmap: 是否始终发送完整的代价地图（而非仅变化部分）
      always_send_full_costmap: True

# =============================================================================
# 5. Global Costmap — 全局代价地图
#    功能: 维护整个已知地图的障碍物信息，供全局路径规划使用
#    特点: 固定在地图坐标系上，不会滚动
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      # update_frequency: 代价地图更新频率 (Hz)
      update_frequency: 1.0
      # publish_frequency: 代价地图发布频率 (Hz)
      publish_frequency: 1.0
      # global_frame: 全局坐标系 — 全局代价地图固定在 map 坐标系上
      global_frame: map
      # robot_base_frame: 机器人基座坐标系
      robot_base_frame: base_link
      # robot_radius: 机器人半径 (m)
      robot_radius: 0.22
      # resolution: 栅格分辨率 (m/cell)
      resolution: 0.05
      # track_unknown_space: 是否追踪未知空间 — true表示区分"未知"和"已知空闲"
      #   对于全局规划，"未知"区域通常视为可通过（allow_unknown: true）
      track_unknown_space: true
      # plugins: 代价地图插件列表
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # --- 障碍物层 (Obstacle Layer) ---
      # 功能: 从传感器数据中提取障碍物，标记到代价地图上（适用于全局地图）
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # --- 静态层 (Static Layer) ---
      # 功能: 从SLAM地图服务器获取静态地图数据
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # map_subscribe_transient_local: ROS2 Jazzy特性 — 订阅瞬态本地地图话题
        map_subscribe_transient_local: True

      # --- 膨胀层 (Inflation Layer) ---
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7

      # always_send_full_costmap: 始终发送完整代价地图
      always_send_full_costmap: True

# =============================================================================
# 6. Map Server (地图服务器) — 已注释，由launch文件配置
#    功能: 加载和提供静态地图文件
#    注意: ROS2 Jazzy中地图yaml文件路径通常由launch文件的默认参数指定
# =============================================================================
# map_server:
#   ros__parameters:
#     # yaml_filename: 地图YAML文件的完整路径
#     # 如果CLI或launch文件提供了地图配置，将使用它们指定的路径
#     yaml_filename: ""

# =============================================================================
# 7. Map Saver — 地图保存器
#    功能: 将SLAM构建的地图保存为文件
#    ROS2 Jazzy中的包: nav2_map_server (使用map_saver_cli或map_saver_server)
# =============================================================================
map_saver:
  ros__parameters:
    # save_map_timeout: 保存地图的超时时间 (s)
    save_map_timeout: 5.0
    # free_thresh_default: 空闲栅格的默认阈值 — 占用概率低于此值视为空闲
    free_thresh_default: 0.25
    # occupied_thresh_default: 占用栅格的默认阈值 — 占用概率高于此值视为障碍
    occupied_thresh_default: 0.65
    # map_subscribe_transient_local: ROS2 Jazzy特性 — 订阅瞬态本地地图
    map_subscribe_transient_local: True

# =============================================================================
# 8. Planner Server — 规划器服务器
#    功能: 在全局代价地图上规划从当前位置到目标的最优路径
#    使用算法: Navfn (基于Dijkstra/A*的全局路径规划器)
#    ROS2 Jazzy中的包: nav2_planner, nav2_navfn_planner
# =============================================================================
planner_server:
  ros__parameters:
    # expected_planner_frequency: 预期规划频率 (Hz) — 实际按需调用，这只是一个参考值
    expected_planner_frequency: 20.0
    # planner_plugins: 规划器插件列表
    planner_plugins: ["GridBased"]
    # costmap_update_timeout: 等待代价地图更新的超时 (s)
    costmap_update_timeout: 1.0

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # tolerance: 路径规划容差 (m) — 目标点的搜索容差，防止因浮点精度问题无法找到路径
      tolerance: 0.5
      # use_astar: 是否使用A*算法 — false使用Dijkstra算法，true使用A*算法
      #   Dijkstra: 保证最短路径但搜索范围大
      #   A*: 启发式搜索，通常更快但不一定是最短路径（在均匀代价网格中等同Dijkstra）
      use_astar: false
      # allow_unknown: 是否允许路径经过未知区域
      #   true: 未知区域可通过（适合探索式导航）
      #   false: 未知区域不可通过（适合已知地图中的保守导航）
      allow_unknown: true

# =============================================================================
# 9. Smoother Server — 路径平滑器服务器
#    功能: 对规划器生成的路径进行平滑处理，减少路径中的折线和突变
#    ROS2 Jazzy中的包: nav2_smoother
# =============================================================================
smoother_server:
  ros__parameters:
    # smoother_plugins: 平滑器插件列表
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # tolerance: 优化收敛容差 — 小于此变化量时认为已收敛
      tolerance: 1.0e-10
      # max_its: 最大迭代次数 — 平滑优化的最大迭代次数上限
      max_its: 1000
      # do_refinement: 是否执行精化步骤 — 在主迭代完成后进行额外的精细化调整
      do_refinement: True

# =============================================================================
# 10. Behavior Server — 行为服务器
#     功能: 提供恢复行为（Recovery Behaviors），当机器人卡住时执行备选动作
#     ROS2 Jazzy中的包: nav2_behaviors
# =============================================================================
behavior_server:
  ros__parameters:
    # local_costmap_topic: 局部代价地图话题
    local_costmap_topic: local_costmap/costmap_raw
    # global_costmap_topic: 全局代价地图话题
    global_costmap_topic: global_costmap/costmap_raw
    # local_footprint_topic: 局部足迹话题（机器人在局部代价地图中的轮廓）
    local_footprint_topic: local_costmap/published_footprint
    # global_footprint_topic: 全局足迹话题
    global_footprint_topic: global_costmap/published_footprint
    # cycle_frequency: 行为循环频率 (Hz)
    cycle_frequency: 10.0
    # behavior_plugins: 启用的行为插件列表
    #   - "spin": 原地旋转 — 尝试找到可通行的方向
    #   - "backup": 后退 — 后退一段距离后重新规划
    #   - "drive_on_heading": 定向行驶 — 沿指定方向行驶直到通畅
    #   - "assisted_teleop": 辅助遥控 — 在碰撞风险下限制人工操作
    #   - "wait": 等待 — 暂停一段时间等待动态障碍物离开
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    # --- 通用行为参数 ---
    # local_frame: 局部坐标系（里程计坐标系）
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    # simulate_ahead_time: 模拟前瞻时间 (s) — 提前模拟此时间来判断行为是否会碰撞
    simulate_ahead_time: 2.0
    # max_rotational_vel: 行为执行时最大旋转速度 (rad/s)
    max_rotational_vel: 1.0
    # min_rotational_vel: 行为执行时最小旋转速度 (rad/s)
    min_rotational_vel: 0.4
    # rotational_acc_lim: 旋转加速度限制 (rad/s²)
    rotational_acc_lim: 3.2

# =============================================================================
# 11. Waypoint Follower — 航点跟随器
#     功能: 按顺序依次导航到多个航点
#     ROS2 Jazzy中的包: nav2_waypoint_follower
# =============================================================================
waypoint_follower:
  ros__parameters:
    # loop_rate: 航点跟随器的主循环频率 (Hz)
    loop_rate: 20
    # stop_on_failure: 某个航点失败时是否停止整个航点序列
    #   false: 自动跳过失败的航点继续执行下一个
    stop_on_failure: false
    # action_server_result_timeout: Action服务器结果等待超时 (s)
    action_server_result_timeout: 900.0
    # waypoint_task_executor_plugin: 航点任务执行器插件 — 在每个航点的行为
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      # waypoint_pause_duration: 在每个航点暂停的时长 (ms) — 200ms的短暂停留
      waypoint_pause_duration: 200

# =============================================================================
# 12. Route Server — 路由服务器
#     功能: 在预定义的路线图上进行长距离导航（常用于仓库、城市等结构化环境）
#     ROS2 Jazzy中的包: nav2_route
# =============================================================================
route_server:
  ros__parameters:
    # graph_filepath: 路线图GeoJSON文件路径 — 通常由launch文件默认设置
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    # boundary_radius_to_achieve_node: 到达路线节点边界的半径 (m) — 到达此范围即认为到达节点
    boundary_radius_to_achieve_node: 1.0
    # radius_to_achieve_node: 到达路线节点的半径 (m) — 较严格的到达判定
    radius_to_achieve_node: 2.0
    # smooth_corners: 是否在路线拐角处进行平滑处理
    smooth_corners: true
    # operations: 路线服务器启用的操作列表
    #   - "AdjustSpeedLimit": 根据路段调整速度限制
    #   - "ReroutingService": 动态重新规划路线
    #   - "CollisionMonitor": 碰撞监控，检测路线上的障碍物
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      # max_collision_dist: 碰撞检测的最大距离 (m)
      max_collision_dist: 3.0

    # edge_cost_functions: 路线图中边的代价评估函数
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    # DistanceScorer: 基于距离的评分 — 边的代价等于几何距离
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    # CostmapScorer: 基于代价地图的评分 — 边穿越代价地图中的高代价区域会增加代价
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

# =============================================================================
# 13. Velocity Smoother — 速度平滑器
#     功能: 对控制器输出的速度指令进行平滑滤波，减少速度突变，提升乘坐舒适度
#     原理: 限制速度和加速度，对输入速度进行低通滤波
#     ROS2 Jazzy中的包: nav2_velocity_smoother
# =============================================================================
velocity_smoother:
  ros__parameters:
    # smoothing_frequency: 平滑器的处理频率 (Hz)
    smoothing_frequency: 20.0
    # stamp_smoothed_velocity_with_smoothing_time: 是否用平滑时间戳代替原始时间戳
    stamp_smoothed_velocity_with_smoothing_time: False
    # scale_velocities: 是否等比缩放速度 — 如果某个方向超限，按比例缩减所有方向
    scale_velocities: False
    # feedback: 平滑器反馈模式
    #   "OPEN_LOOP": 开环控制 — 仅对输入指令做平滑，不参考实际里程计
    #   "CLOSED_LOOP": 闭环控制 — 根据实际里程计反馈调整平滑策略
    feedback: "OPEN_LOOP"
    # max_velocity: 最大速度 [vx, vy, vtheta] — [线速度X, 线速度Y, 角速度]
    max_velocity: [0.5, 0.0, 2.0]
    # min_velocity: 最小速度 [vx, vy, vtheta] — 负值表示允许反向运动
    min_velocity: [-0.5, 0.0, -2.0]
    # max_accel: 最大加速度 [ax, ay, atheta] — 正值表示加速限制
    max_accel: [2.5, 0.0, 3.2]
    # max_decel: 最大减速度 [ax, ay, atheta] — 负值表示减速限制
    #   减速度通常比加速度更激进，因为紧急停止需要更大减速度
    max_decel: [-2.5, 0.0, -3.2]
    # odom_topic: 里程计话题名称（闭环模式下使用）
    odom_topic: "odom"
    # odom_duration: 里程计数据的有效持续时间 (s)
    odom_duration: 0.1
    # deadband_velocity: 速度死区 [vx, vy, vtheta] — 低于此值的速度指令被设为零
    deadband_velocity: [0.0, 0.0, 0.0]
    # velocity_timeout: 速度指令超时 (s) — 超过此时间未收到新指令则停止机器人
    velocity_timeout: 1.0

# =============================================================================
# 14. Collision Monitor — 碰撞监视器
#     功能: 基于传感器数据实时监控碰撞风险，必要时停止或减速机器人
#     特点: 独立于控制器运行，作为最后的安全保障
#     ROS2 Jazzy中的包: nav2_collision_monitor
# =============================================================================
collision_monitor:
  ros__parameters:
    # base_frame_id: 机器人基座坐标系
    base_frame_id: "base_footprint"
    # odom_frame_id: 里程计坐标系
    odom_frame_id: "odom"
    # cmd_vel_in_topic: 输入速度指令话题（来自速度平滑器）
    cmd_vel_in_topic: "cmd_vel_smoothed"
    # cmd_vel_out_topic: 输出速度指令话题（可能被碰撞监视器修改或阻止）
    cmd_vel_out_topic: "cmd_vel"
    # state_topic: 碰撞监视器状态发布话题
    state_topic: "collision_monitor_state"
    # transform_tolerance: TF变换容忍时间 (s)
    transform_tolerance: 0.2
    # source_timeout: 传感器数据源超时 (s) — 超过此时间未收到数据则触发安全停止
    source_timeout: 1.0
    # base_shift_correction: 是否修正机器人基座坐标系与里程计的偏移
    base_shift_correction: True
    # stop_pub_timeout: 停止发布超时 (s) — 停止指令发布的最大持续时间
    stop_pub_timeout: 2.0
    # polygons: 碰撞检测多边形区域 — 定义机器人周边的检测区域
    polygons: ["FootprintApproach"]
    # FootprintApproach: 足迹接近型检测区域
    FootprintApproach:
      type: "polygon"                        # 类型: 多边形检测区域
      # action_type: "approach" — 当检测到障碍物进入此区域时减速接近
      action_type: "approach"
      # footprint_topic: 获取机器人轮廓的话题
      footprint_topic: "/local_costmap/published_footprint"
      # time_before_collision: 预测碰撞时间 (s) — 预测此时间后的碰撞风险
      time_before_collision: 1.2
      # simulation_time_step: 碰撞预测仿真时间步长 (s)
      simulation_time_step: 0.1
      # min_points: 构成有效障碍物的最小传感器数据点数
      min_points: 6
      visualize: False
      enabled: True

    # observation_sources: 碰撞检测的观测源列表
    observation_sources: ["scan"]
    scan:
      type: "scan"               # 类型: 激光扫描
      topic: "scan"              # 扫描数据话题
      min_height: 0.15           # 最小检测高度 (m) — 低于此高度的物体忽略（如地面反射）
      max_height: 2.0            # 最大检测高度 (m) — 高于此高度的物体忽略（如天花板）
      enabled: True

# =============================================================================
# 15. Docking Server — 自动回充/对接服务器
#     功能: 控制机器人自动导航到充电桩并进行精确对接
#     ROS2 Jazzy中的包: opennav_docking (非Nav2核心包，属于Open Navigation项目)
#     注意: 此功能需要充电桩的视觉/红外检测参考系
# =============================================================================
docking_server:
  ros__parameters:
    # controller_frequency: 对接控制器频率 (Hz) — 较高频率以保证对接精度
    controller_frequency: 50.0
    # initial_perception_timeout: 初始感知探测器超时 (s) — 开始对接前寻找充电桩的超时
    initial_perception_timeout: 5.0
    # wait_charge_timeout: 等待充电开始的超时 (s)
    wait_charge_timeout: 5.0
    # dock_approach_timeout: 对接接近过程总超时 (s)
    dock_approach_timeout: 30.0
    # undock_linear_tolerance: 退出充电桩的线位置容差 (m)
    undock_linear_tolerance: 0.05
    # undock_angular_tolerance: 退出充电桩的角度容差 (rad)
    undock_angular_tolerance: 0.1
    # max_retries: 对接失败后的最大重试次数
    max_retries: 3
    # base_frame: 机器人基座坐标系
    base_frame: "base_link"
    # fixed_frame: 固定坐标系（里程计）
    fixed_frame: "odom"
    # dock_backwards: 是否倒车进入充电桩
    dock_backwards: false
    # dock_prestaging_tolerance: 预对接位置的容差 (m)
    dock_prestaging_tolerance: 0.5

    # dock_plugins: 充电桩类型插件列表
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      # docking_threshold: 对接成功判断阈值 (m) — 距目标小于此值即认为对接成功
      docking_threshold: 0.05
      # staging_x_offset: 预对接位置在X方向的偏移 (m) — 在对接前，机器人在充电桩前方的等待位置
      staging_x_offset: -0.7
      # use_external_detection_pose: 是否使用外部检测位姿（如视觉/红外传感器检测充电桩精确位置）
      use_external_detection_pose: true
      # use_battery_status: 是否使用电池状态来判断充电是否完成
      use_battery_status: false
      # use_stall_detection: 是否使用堵转检测 — 检测机器人是否已接触到充电桩
      use_stall_detection: false

      # --- 外部检测参数 (视觉/红外充电桩定位) ---
      # external_detection_timeout: 外部检测超时 (s)
      external_detection_timeout: 1.0
      # external_detection_translation_x: 外部检测器在机器人坐标系中的X轴位置 (m)
      external_detection_translation_x: -0.18
      # external_detection_translation_y: 外部检测器在机器人坐标系中的Y轴位置 (m)
      external_detection_translation_y: 0.0
      # external_detection_rotation_roll: 外部检测器绕X轴旋转 (rad) — 约-90°
      external_detection_rotation_roll: -1.57
      # external_detection_rotation_pitch: 外部检测器绕Y轴旋转 (rad) — 约-90°
      external_detection_rotation_pitch: -1.57
      # external_detection_rotation_yaw: 外部检测器绕Z轴旋转 (rad)
      external_detection_rotation_yaw: 0.0
      # filter_coef: 外部检测位姿的低通滤波系数 — 平滑检测噪声
      filter_coef: 0.1

    # --- 充电桩实例 (可配置多个充电桩) ---
    # 使用时取消注释并填入实际的充电桩位姿
    # docks: ['home_dock']
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map              # 充电桩所在的坐标系
    #   pose: [0.0, 0.0, 0.0]  # 充电桩在map坐标系中的位姿 [x, y, yaw]

    # --- 对接控制器参数 ---
    controller:
      # k_phi: 航向控制比例增益 — 朝向偏差的纠正强度
      k_phi: 3.0
      # k_delta: 横向控制比例增益 — 横向偏差的纠正强度
      k_delta: 2.0
      # v_linear_min: 对接过程中最小线速度 (m/s)
      v_linear_min: 0.15
      # v_linear_max: 对接过程中最大线速度 (m/s) — 与最小值相同，保持恒速
      v_linear_max: 0.15
      # use_collision_detection: 是否在对接过程中启用碰撞检测
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      # projection_time: 碰撞检测的前向预测时间 (s)
      projection_time: 5.0
      # simulation_step: 碰撞预测仿真步长 (s)
      simulation_step: 0.1
      # dock_collision_threshold: 对接碰撞判定阈值 — 代价地图值超过此值认为碰撞
      dock_collision_threshold: 0.3

# =============================================================================
# 16. Loopback Simulator — 回环模拟器 (仅用于仿真)
#     功能: 在仿真环境中生成模拟的里程计和激光扫描数据
#     适用: TurtleBot4仿真或其他使用loopback模拟器的仿真环境
#     注意: 实际硬件运行时此配置不生效
# =============================================================================
loopback_simulator:
  ros__parameters:
    # base_frame_id: 机器人基座坐标系
    base_frame_id: "base_footprint"
    # odom_frame_id: 里程计坐标系
    odom_frame_id: "odom"
    # map_frame_id: 地图坐标系
    map_frame_id: "map"
    # scan_frame_id: 激光雷达坐标系
    #   注: tb4_loopback_simulator.launch.py 会将其重映射为 'rplidar_link'
    scan_frame_id: "base_scan"
    # update_duration: 仿真更新周期 (s) — 50Hz更新频率
    update_duration: 0.02
    # --- 模拟激光雷达参数 ---
    # scan_range_min: 激光最小量程 (m)
    scan_range_min: 0.05
    # scan_range_max: 激光最大量程 (m)
    scan_range_max: 30.0
    # scan_angle_min: 激光扫描起始角度 (rad) — -180° (约值)
    scan_angle_min: -3.1415
    # scan_angle_max: 激光扫描结束角度 (rad) — +180° (约值)
    scan_angle_max: 3.1415
    # scan_angle_increment: 激光扫描角度增量 (rad) — 约1.5°分辨率，共240个采样点
    scan_angle_increment: 0.02617
    # scan_use_inf: 是否使用无穷大表示无效测量 — true表示无限远处无测量
    scan_use_inf: true
