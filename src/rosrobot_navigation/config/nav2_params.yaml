# ============================================================
# Nav2 全栈导航统一参数文件（修正版）
# 适用于 ROS2 Jazzy
# 使用方式：在 launch 中通过 parameters=[nav2_params.yaml] 加载
# ============================================================

# --- Map Server ---
# 负责从 YAML+PGM 文件加载并发布占用栅格地图 (/map)
map_server:
  ros__parameters:
    use_sim_time: false          # 是否使用仿真时间（Gazebo 中设为 true）
    yaml_filename: ""            # 地图描述文件的绝对路径，通常由 launch 动态传入
    frame_id: "map"              # 地图的坐标系名称
    topic_name: "map"            # 发布地图的话题名称
    # 注意：map_server 没有 published_frequency 和 allow_unknown 参数，已删除

# --- AMCL (自适应蒙特卡洛定位) ---
# 根据激光雷达和里程计估计机器人在 map 坐标系下的位姿
amcl:
  ros__parameters:
    use_sim_time: false

    # ----- 运动模型参数 -----
    alpha1: 0.2                  # 旋转分量中的角度噪声标准差
    alpha2: 0.2                  # 平移分量中的角度噪声标准差
    alpha3: 0.2                  # 旋转分量中的平移噪声标准差
    alpha4: 0.2                  # 平移分量中的平移噪声标准差
    alpha5: 0.2                  # 额外的平移噪声（用于差速模型）

    # ----- 坐标系 -----
    base_frame_id: "base_link"   # 机器人基座坐标系
    global_frame_id: "map"            # 全局坐标系（即地图坐标系）

    # ----- 激光雷达模型参数 -----
    lambda_short: 0.1            # 短距离测量指数分布衰减系数
    laser_likelihood_max_dist: 2.0    # 似然场最大距离（米），超出此距离认为不可能
    laser_max_range: 8.0       # 激光雷达最大有效量程（米）
    laser_min_range: -1.0        # 最小有效量程（负值表示不限制）
    max_beams: 60                # 每次更新使用的最大光束数量
    sigma_hit: 0.2               # 击中概率的高斯标准差
    z_hit: 0.95                  # 击中概率的权重
    z_max: 0.05                  # 最大距离测量的权重
    z_rand: 0.5                  # 随机测量的权重
    z_short: 0.05                # 短距离测量的权重

    # ----- 粒子滤波器参数 -----
    min_particles: 500           # 最小粒子数
    max_particles: 2000          # 最大粒子数
    pf_err: 0.01                 # 粒子滤波器误差容忍度
    pf_z: 0.99                   # 粒子滤波器贝叶斯因子
    recovery_alpha_slow: 0.001   # 缓慢恢复的指数衰减系数
    recovery_alpha_fast: 0.1     # 快速恢复的指数衰减系数
    resample_interval: 1         # 每多少帧重采样一次
    save_pose_rate: 0.5          # 保存位姿到磁盘的频率（Hz）

    # ----- 机器人模型 -----
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # 机器人运动模型：differential / omnidirectional

    # ----- TF 广播 -----
    tf_broadcast: true           # 是否广播 map -> odom 变换
    transform_tolerance: 1.0     # 变换允许的最大延迟（秒）

    # ----- 更新条件 -----
    update_min_a: 0.2            # 触发更新的最小旋转角度变化（弧度）
    update_min_d: 0.25           # 触发更新的最小位移变化（米）

    # ----- 初始位姿 -----
    set_initial_pose: true       # 是否设置初始位姿
    initial_pose_x: 0.0          # 初始 x 坐标（米）
    initial_pose_y: 0.0          # 初始 y 坐标（米）
    initial_pose_yaw: 0.0        # 初始朝向角（弧度）
    # 注意：initial_pose_z 已删除（2D 定位不需要）

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
# --- Planner (全局路径规划) ---
# 使用 NavFn 算法计算从起点到终点的全局路径
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]          # 规划器
    GridBased:
#      plugin: "nav2_navfn_planner/NavfnPlanner"   # ← 建议明确指定插件类型
      tolerance: 0.5               # 到达目标点的容忍距离（米）
      use_astar: false             # 是否使用 A* 算法（false 使用 Dijkstra）
      allow_unknown: true          # 是否允许路径经过未知区域


# --- Controller (局部路径跟踪) ---
# 使用 Regulated Pure Pursuit 算法跟踪全局路径，输出速度指令
controller_server:
  ros__parameters:

    cmd_vel_topic: "/cmd_vel_nav"
    use_sim_time: false
    controller_frequency: 20.0
    # 最小线速度阈值（m/s），低于此值视为静止，用于进度检查
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.2
    min_theta_velocity_threshold: 0.01

    # 失败容忍度（m），当机器人离全局路径的距离超过此值时放弃跟踪
    failure_tolerance: 0.3

    desired_linear_vel: 0.2     # 期望线速度（m/s）
    max_linear_accel: 0.5        # 最大线加速度（m/s²）
    max_linear_decel: 0.5        # 最大线减速度（m/s²）
    lookahead_dist: 1.0          # 预瞄距离（米）
    min_lookahead_dist: 0.7      # 最小预瞄距离（米）
    max_lookahead_dist: 1.5      # 最大预瞄距离（米）
    use_velocity_scaled_lookahead_dist: false  # 是否根据速度缩放预瞄距离
    rotate_to_heading_angular_vel: 0.5  # 原地旋转时的角速度（rad/s）
    transform_tolerance: 0.1     # 变换容忍时间（秒）
    use_collision_detection: true       # 是否启用碰撞检测
    collision_check_distance: 0.8       # 碰撞检测的前向扫描距离（米）
    # 注意：删除了非标准参数 costmap_topic 和 footprint_topic
    # 进度检查器和目标检查器的插件名称列表
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    # 控制器插件列表，这里使用 DWB 局部规划器
    controller_plugins: ["FollowPath"]
    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    # -------------------- DWB 局部规划器 --------------------
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # 调试选项：是否在 /trajectories 话题发布所有候选轨迹
      debug_trajectory_details: True
      # 速度限制（m/s 或 rad/s）
      min_vel_x: 0.0                       # 最小前进速度
      min_vel_y: 0.0                       # 最小横向速度（差速机器人设为0）
      max_vel_x: 0.2                      # 最大前进速度（建议 ≤ 0.5）
      max_vel_y: 0.2                       # 最大横向速度（差速机器人设为0）
      max_vel_theta: 0.4                   # 最大旋转角速度（rad/s）


      # 综合速度限制
      min_speed_xy: 0.0                   # 最小合速度（m/s）
      max_speed_xy: 0.2                   # 最大合速度（m/s）
      min_speed_theta: 0.0                 # 最小角速度（rad/s）

      # 加速度限制（m/s² 或 rad/s²）
      acc_lim_x: 0.2                       # 最大正向加速度
      acc_lim_y: 0.2                       # 最大横向加速度
      acc_lim_theta: 0.6                   # 最大角加速度
      decel_lim_x: -0.2                    # 最大减速度（负值）
      decel_lim_y: -0.2
      decel_lim_theta: -0.6

      # 采样参数
      vx_samples: 20                       # 线速度采样点数
      vy_samples: 5                        # 横向速度采样点数
      vtheta_samples: 20                   # 角速度采样点数

      # 轨迹模拟参数
      sim_time: 1.7                        # 模拟轨迹的时间长度（秒）
      linear_granularity: 0.05             # 轨迹上相邻点的距离间隔（m）
      angular_granularity: 0.025           # 轨迹上相邻点的角度间隔（rad）

      # 变换容忍时间（秒），用于 TF 缓冲
      transform_tolerance: 0.2

      # 是否在找到可行轨迹后立即停止评估（提高效率）
      short_circuit_trajectory_evaluation: True

      # 是否启用状态机（记住上次选择的轨迹方向）
      stateful: True

      # ========== 评价函数（Critics） ==========
      # 所有 critics 的名称列表，顺序影响权重
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist", "Twirling"]

      # 每个 critic 的具体配置（必须与列表中的名称一一对应）

      # 1. 旋转到目标方向：鼓励机器人在接近目标时调整航向
      RotateToGoal:
        plugin: "dwb_critics::RotateToGoalCritic"

      # 2. 振荡检测：惩罚来回摆动，抑制震荡行为
      Oscillation:
        plugin: "dwb_critics::OscillationCritic"

      # 3. 基础障碍物：惩罚靠近障碍物的轨迹
      BaseObstacle:
        plugin: "dwb_critics::BaseObstacleCritic"

      # 4. 目标对齐：奖励轨迹终点与目标点对齐
      GoalAlign:
        plugin: "dwb_critics::GoalAlignCritic"

      # 5. 路径对齐：奖励轨迹与全局路径对齐
      PathAlign:
        plugin: "dwb_critics::PathAlignCritic"

      # 6. 路径距离：奖励离全局路径近的轨迹
      PathDist:
        plugin: "dwb_critics::PathDistCritic"

      # 7. 目标距离：奖励离目标点近的轨迹
      GoalDist:
        plugin: "dwb_critics::GoalDistCritic"

      # 8. 旋转惩罚：惩罚轨迹中过多的自身旋转
      Twirling:
        plugin: "dwb_critics::TwirlingCritic"

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav"
    enable_stamped_cmd_vel: False           # Jazzy 默认 False，使用 Twist
    observation_sources: ["scan"]
    # 激光雷达数据源
    scan:
      type: "scan"
      topic: "scan"

    # 安全多边形区域
    polygons: ["PolygonStop"]

    # 停止区域：机器人前方 0.4m、宽 0.6m 的矩形
    # 点顺序：左上 → 右上 → 右下 → 左下
    PolygonStop:
      type: "polygon"
      points: "[[0.4, 0.3], [0.4, -0.3], [0.0, -0.3], [0.0, 0.3]]"
      action_type: "stop"          # 检测到障碍物 → 急停
      min_points: 4                # 至少 4 个点触发

    # ========== 速度限制（适配你小车 0.2 m/s 最高速） ==========
    max_linear_velocity: 0.2        # 最大线速度（m/s），与小车一致
    min_linear_velocity: -0.1     # 允许缓慢倒车
    max_angular_velocity: 0.5        # 最大角速度（rad/s）
    min_angular_velocity: -0.5

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true              # 启动后自动依次激活所有节点
    bond_timeout: 0.0            # 连接超时时间（0 表示无限等待）
    node_names:                  # 需要管理的节点名称列表（必须与实际启动的节点一致）
      - map_server
      - amcl
      - planner_server
      - controller_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - behavior_server
      - smoother_server
      - route_server
