slam_toolbox:
  ros__parameters:
     #---------- 坐标系（注意：ROS 2 中 frame_id 绝对不能带前导斜杠） ----------
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    restamp_tf: false
    transform_publish_period: 0.02  # TF 发布周期，单位：秒（默认：0.02，设为 0 则不发布里程计）
    transform_timeout: 0.2          # TF查询超时时间
    tf_buffer_duration: 30.0        # 缓存持续时间，单位：秒（默认：30.0）

    # 输入激光雷达话题
    scan_topic: /scan

    # ---------- 话题和传感器参数 ----------
    mode: mapping                   # mapping/localization

    max_laser_range: 8.0            # 激光最大距离
    # min_pass_through: 0.15        # 最小通过距离
    throttle_scans: 1               # 扫描将采样
    use_scan_barycenter: false      # 是否使用扫描质心替代原始点云（减少计算量）
    use_scan_matching: true         # 是否启用扫描匹配（关闭后只靠里程计更新

    # ---------- 地图参数 ----------
    odom_linear_covariance: 0.5
    resolution: 0.03                # 地图分辨率（米/像素），越小越精细但内存越大
    map_update_interval: 1.5        # 全图更新间隔（秒），数值越大更新越慢
    map_name: map
    map_file_name: map
    map_start_at_dock: false
#    map_start_pose: [0.0,0.0,0.0]    # 起始位姿 [x, y, theta]
#    occupancy_threshold: 0.65      # 占据概率阈值，高于此标记为障碍物
    use_map_saver: true

    # ---------- 运动触发更新 ----------
    minimum_travel_distance: 0.2   # 机器人移动多少米后才触发一次地图更新
    minimum_travel_heading: 0.05    # 机器人旋转多少弧度后才触发一次地图更新
    minimum_time_interval: 0.5    # 两次更新之间的最短时间间隔（秒）
    check_min_dist_and_heading_precisely: false   # 是否精确检查最小位移/角度（避免跳过小运动）
    # ransform_tolerance: 0.2        # 时间戳对齐
    scan_buffer_size: 20            # 扫描缓冲区大小 阿克曼小车转弯半径大，
    # 需要更多历史扫描帧来做闭环。当前 scan_buffer_size: 10 偏小，建议增大到 15~20。

    # ---------- 扫描匹配相关 ----------
    correlation_search_space_dimension:	2.0	# 粗搜索空间尺寸（米×米）
    correlation_search_space_resolution: 0.025	# 粗搜索步长（米）
    correlation_search_space_smear_deviation: 0.03	# 模糊化标准差（平滑似然场）
    coarse_angle_resolution: 0.0524	# 粗搜索角度分辨率（弧度≈2°）
    coarse_search_angle_offset: 0.349	# 粗搜索角度范围偏移（弧度≈20°）
    fine_search_angle_offset: 0.087	# 精搜索角度范围偏移（弧度≈5°）
    link_match_minimum_response_fine: 0.35	# 帧间匹配最小响应值（低于此认为匹配失败）
    link_scan_maximum_distance: 3.5	# 帧间匹配的最大搜索距离（米）
    use_response_expansion: false	# 是否动态扩展响应阈值（自适应调整）


    # ---------- 闭环检测 ----------
    do_loop_closing: true           # 启用闭环检测
    loop_search_radius: 4.0         # 闭环检测搜索半径
    loop_closure_min_score: 0.7     # 闭环匹配最小分数

    loop_match_minimum_chain_size: 10	# 闭环候选链的最小长度（帧数）
    loop_match_minimum_response_coarse:	0.45	# 粗匹配阶段闭环最小响应值
    loop_match_minimum_response_fine: 0.35	# 精匹配阶段闭环最小响应值
    loop_match_maximum_variance_coarse: 3.0	# 粗匹配最大允许方差（控制匹配质量）
    loop_search_maximum_distance: 7.5	# 闭环搜索半径（米）
    loop_search_space_dimension: 8.0	# 闭环搜索空间尺寸（米×米）
    loop_search_space_resolution: 0.025	# 闭环搜索步长（米）
    loop_search_space_smear_deviation: 0.04	# 闭环搜索模糊化标准差


    # ---------- 其他 ----------
    enable_interactive_mode: false  # 非交互模式节省内存



#dengfei@jackifei-ubuntu:~$ ros2 param list /slam_toolbox
#1. 基础 ROS 参数 (ROS Parameters)
#odom_frame: 里程计坐标系名称（默认：odom）
#map_frame: 地图坐标系名称（默认：map）
#base_frame: 机器人基坐标系名称（默认：base_footprint 或 base_link）
#scan_topic: 激光雷达数据话题（默认：/scan）
#mode: 工作模式，可选 mapping（建图）或 localization（定位）
#use_map_saver: 是否启用地图保存功能（默认：true）
#debug_logging: 是否启用调试日志（默认：false）


#map_update_interval: 地图更新间隔，单位：秒（默认：5.0）
#min_laser_range: 最小激光距离，用于栅格化（默认：0.0）
#max_laser_range: 最大激光距离，用于栅格化（默认：20.0）
#throttle_scans: 扫描数据处理频率（1 表示全部处理）

#minimum_time_interval: 最小时间间隔，单位：秒（默认：0.5）

#stack_size_to_use: 序列化大地图所需的栈大小（默认：40000000）

#3. 扫描匹配参数 (Scan Matching)
#use_scan_matching: 是否启用扫描匹配（默认：true）
#use_scan_barycenter: 是否使用扫描重心对齐（默认：true）
#minimum_travel_distance: 触发更新的最小移动距离，单位：米（默认：0.3）
#minimum_travel_heading: 触发更新的最小转向角度，单位：弧度（默认：约 0.087，即5度）
#scan_buffer_size: 扫描缓冲区大小（默认：67）
#scan_buffer_maximum_scan_distance: 缓冲区最大扫描距离，单位：米（默认：20.0）

#4. 回环检测参数 (Loop Closure)
#do_loop_closing: 是否进行回环检测（默认：true）
#loop_search_maximum_distance: 回环搜索最大距离，单位：米（默认：4.0）
#loop_match_minimum_chain_size: 回环匹配最小链长度（默认：10）
#loop_match_maximum_variance_coarse: 粗匹配最大方差（默认：0.16）
#loop_match_minimum_response_coarse: 粗匹配最小响应值（默认：0.7）
#loop_match_minimum_response_fine: 精细匹配最小响应值（默认：0.5）

#5. 求解器插件参数 (Solver Plugin)
#solver_plugin: 优化算法底层实现（默认：solver_plugins::CeresSolver）
#ceres_linear_solver: 线性求解器（默认：SPARSE_NORMAL_CHOLESKY）
#ceres_preconditioner: 预处理器（默认：SCHUR_JACOBI）
#ceres_trust_strategy: 信任策略（默认：LEVENBERG_MARQUARDT）
#ceres_loss_function: 损失函数（默认：None）
